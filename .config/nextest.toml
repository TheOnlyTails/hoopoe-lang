nextest-version = "0.9.91"

[test-groups.compiler-heavy]
max-threads = 2

[profile.throughput]
test-threads = 4
fail-fast = false
status-level = "slow"
final-status-level = "slow"

[profile.throughput.junit]
path = "junit.xml"
report-name = "hoopoe-throughput"

[[profile.throughput.overrides]]
filter = "package(hoopoe-compiler) | package(hoopoe-cli) | package(hoopoe-lsp)"
test-group = "compiler-heavy"

[[profile.throughput.overrides]]
filter = "binary(docs_samples)"
priority = 100
test-group = "compiler-heavy"
