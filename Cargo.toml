[workspace]
resolver = "3"
members = [
	"crates/hoopoe-ast",
	"crates/hoopoe-diagnostics",
	"crates/hoopoe-errorcode",
	"crates/hoopoe-syntax",
	"crates/hoopoe-format",
	"crates/hoopoe-hir",
	"crates/hoopoe-sema",
	"crates/hoopoe-codegen",
	# Added layer by layer as each crate is built:
	"crates/hoopoe-compiler",
	"crates/hoopoe-project",
	"crates/hoopoe-cli",
	"crates/hoopoe-lsp",
	"crates/hoopoe-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://hoopoe-lang.dev/"
repository = "https://github.com/theonlytails/hoopoe-lang"
authors = ["Shachar Zidon <theonlytails@theonlytails.com>"]

[workspace.dependencies]
# Internal crates
hoopoe-ast = { path = "crates/hoopoe-ast" }
hoopoe-diagnostics = { path = "crates/hoopoe-diagnostics" }
hoopoe-errorcode = { path = "crates/hoopoe-errorcode" }
hoopoe-syntax = { path = "crates/hoopoe-syntax" }
hoopoe-format = { path = "crates/hoopoe-format" }
hoopoe-hir = { path = "crates/hoopoe-hir" }
hoopoe-sema = { path = "crates/hoopoe-sema" }
hoopoe-codegen = { path = "crates/hoopoe-codegen" }
hoopoe-compiler = { path = "crates/hoopoe-compiler" }
hoopoe-project = { path = "crates/hoopoe-project" }

# Shared external dependencies (proven set carried over from the previous implementation)
anyhow = "1.0.104"
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
crossbeam-channel = "0.5.17"
ecow = "0.3.1"
ena = "0.14.4"
num-bigint = "0.5.1"
ordered-float = "5.5.0"
oxc = { version = "0.150.0", features = ["codegen", "transformer", "semantic"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
rustix = { version = "1.1.5", features = ["fs"] }
salsa = "0.28.4"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
url = { version = "2.5.8", features = ["serde"] }

[profile.bench]
debug = true
