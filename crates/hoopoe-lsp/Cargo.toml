[package]
name = "hoopoe-lsp"
description = "The Hoopoe language server (diagnostics + hover) over stdio, for the VS Code extension."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "hoopoe-lsp"
path = "src/main.rs"

[dependencies]
hoopoe-compiler = { workspace = true }
hoopoe-project = { workspace = true }
hoopoe-sema = { workspace = true }
hoopoe-syntax = { workspace = true }
hoopoe-diagnostics = { workspace = true }
hoopoe-ast = { workspace = true }
hoopoe-format = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.150"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
percent-encoding = "2.3.2"
strsim = { workspace = true }

[dev-dependencies]
hoopoe-compiler = { workspace = true, features = ["test-support"] }
tempfile = "3"
