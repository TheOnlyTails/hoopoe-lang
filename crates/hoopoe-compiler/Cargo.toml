[package]
name = "hoopoe-compiler"
description = "The Hoopoe compiler pipeline: the top-level API for parsing, checking, and compiling Hoopoe source to JavaScript."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["bundler-rolldown"]
bundler-rolldown = ["dep:oxc", "dep:rolldown", "dep:tokio"]
bundler-swc = [
	"dep:anyhow",
	"dep:swc_bundler",
	"dep:swc_common",
	"dep:swc_ecma_ast",
	"dep:swc_ecma_codegen",
	"dep:swc_ecma_loader",
	"dep:swc_ecma_parser",
]
test-support = ["dep:serde_json"]

[dependencies]
hoopoe-syntax = { workspace = true }
hoopoe-sema = { workspace = true }
hoopoe-codegen = { workspace = true }
hoopoe-diagnostics = { workspace = true }
hoopoe-ast = { workspace = true }
hoopoe-hir = { workspace = true }
hoopoe-format = { workspace = true }
ecow = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
blake3 = "1.8.2"
salsa = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1.0.150", optional = true }
anyhow = { version = "1", optional = true }
swc_bundler = { version = "54.0.0", optional = true }
swc_common = { version = "24.0.0", optional = true }
swc_ecma_ast = { version = "27.0.0", optional = true }
swc_ecma_codegen = { version = "30.0.0", optional = true }
swc_ecma_loader = { version = "25.0.0", optional = true }
swc_ecma_parser = { version = "43.0.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxc = { workspace = true, optional = true }
rolldown = { version = "1.2.0", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
serde_json = "1.0.150"

[lints.clippy]
all = "warn"

[[bench]]
name = "incremental_project"
harness = false
required-features = ["test-support"]

[[bin]]
name = "issue_81_evidence"
path = "src/bin/issue_81_evidence.rs"
required-features = ["test-support"]
